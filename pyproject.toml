[project]
name = "pharmavision"
version = "0.1.0"
description = "Rodent behaviour test video in; scored, analysed, ARRIVE-compliant results section out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  # artifacts and stage contracts
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18.0",
  # measure: geometry and masks
  "shapely>=2.0",
  "opencv-python-headless>=4.10",
  "pycocotools>=2.0.8",
  # stats
  "scipy>=1.14",
  # models (Meta Model API is OpenAI-compatible)
  "openai>=1.50",
  "meta-sam-parser>=0.1.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  # app
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "pyright>=1.1.390",
  "scipy-stubs>=1.18.1.1",
  "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmavision"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]
# Vendored skills are third-party prose and helper scripts, not project code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
# Its fixture prose is written as a report would be: with the × and − signs ruff flags.
"tests/test_number_audit.py" = ["RUF001"]

[tool.pyright]
include = ["src", "tests", "spike", "eval"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# NFR-6: the measure and stats layers are where every number comes from, and the audit is what
# keeps every other number out, so they are strict.
strict = [
  "src/pharmavision/measure",
  "src/pharmavision/stats",
  "src/pharmavision/audit",
  "src/pharmavision/arrive.py",
  # The eval's numbers (tracking against DLC, spend) feed eval/REPORT.md and the README.
  "eval/dlc.py",
  "eval/spend.py",
  "eval/tracking.py",
]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# spike/ (the T2 measurement scripts) and eval/ (the eval harness) are top-level packages, run
# on the laptop and not part of the wheel.
pythonpath = ["."]
