# The number audit is pure, like stats/: no I/O and no model calls (CLAUDE.md, NFR-1).
# Same rules as the project, plus these bans, so `scripts/check.sh` enforces it.
extend = "../../../pyproject.toml"

[lint]
# TID251 enforces the bans below. It can't ban builtins, so T20 catches print() and PTH123
# catches any open() (it suggests Path.open, which the pathlib ban then rules out).
extend-select = ["TID251", "T20", "PTH123"]

[lint.flake8-tidy-imports.banned-api]
"io".msg = "audit/ does no I/O."
"os".msg = "audit/ does no I/O."
"pathlib".msg = "audit/ does no I/O: take values, not paths."
"shutil".msg = "audit/ does no I/O."
"subprocess".msg = "audit/ does no I/O."
"socket".msg = "audit/ makes no network calls."
"urllib".msg = "audit/ makes no network calls."
"httpx".msg = "audit/ makes no network calls."
"openai".msg = "audit/ makes no model calls: the gate must not take a model's word."
"pyarrow".msg = "audit/ does no I/O."
"yaml".msg = "audit/ does no I/O."
"pharmavision.artifacts.RunFolder".msg = "audit/ takes the tool outputs as values; the report stage reads them."
"pharmavision.artifacts.StudyFolder".msg = "audit/ takes the tool outputs as values; the report stage reads them."
"pharmavision.segmenter".msg = "audit/ makes no model calls."
"pharmavision.judge".msg = "audit/ makes no model calls."
"pharmavision.model_api".msg = "audit/ makes no model calls."
"pharmavision.model_cache".msg = "audit/ does no I/O and makes no model calls."
"pharmavision.stages".msg = "audit/ is called by the stages, never the reverse."
"pharmavision.pipeline".msg = "audit/ is called by the stages, never the reverse."
"pharmavision.measure".msg = "audit/ checks numbers; computing them is measure/'s job."
"pharmavision.stats".msg = "audit/ checks numbers; computing them is stats/'s job."
