# Render blueprint for the public demo site (ARCHITECTURE "Deploy"): one Docker web service,
# one process, read-only. Set DEMO_URL and DEMO_SHA256 in the dashboard (scripts/pack-demo.sh
# prints the checksum); the site starts no model calls, so it needs no MODEL_API_KEY.
services:
  - type: web
    name: pharmavision
    runtime: docker
    # Free: the demo only has to last through judging. It sleeps after 15 min idle, so the first
    # visit after that waits about a minute while it wakes.
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DEMO_URL
        sync: false
      - key: DEMO_SHA256
        sync: false
